<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Juego de Memoria</h1>
        <p>Encuentra todas las parejas</p>
        <p>Pulsa "n" para habilitar el modo oscuro</p>

    </header>
    
    <main class="contenedorJuego">
        <div id="tablero"></div>
        <div id="controles">
            <button class="btnDificultad facil" data-pares="6">Fácil (12)</button>
            <button class="btnDificultad normal" data-pares="8">Normal (16)</button>
            <button class="btnDificultad dificil" data-pares="10">Difícil (20)</button>
            <button class="btnDificultad muy-dificil" data-pares="12">Extremo (24)</button>
        </div>
    </div>
    </main>

    <!--ventana de victoria-->
    <div id="victoria" class="oculto">
        <div class="contenido">
            <h2>¡Felicidades, has ganado! </h2>
            <p>Has necesitado <strong id="numIntentos">0</strong> intentos para completar el panel.</p>
            <button id="btnReiniciar">Jugar de nuevo</button>
        </div>
    </div>
    
</body>
</html>
